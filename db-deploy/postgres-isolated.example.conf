# Verified shape for a separate PostgreSQL 16 AXO Streams cluster.
# Keep the data directory and systemd unit isolated from every other product.
data_directory = '/var/lib/axo-streams-postgres'
hba_file = '/etc/axo-streams-postgres/pg_hba.conf'
ident_file = '/etc/axo-streams-postgres/pg_ident.conf'
listen_addresses = ''
port = 5432
unix_socket_directories = '/run/axo-streams-postgres'
unix_socket_permissions = 0770
unix_socket_group = 'axostreams'
max_connections = 15
shared_buffers = '64MB'
work_mem = '2MB'
maintenance_work_mem = '32MB'
effective_cache_size = '256MB'
statement_timeout = '3s'
lock_timeout = '2s'
idle_in_transaction_session_timeout = '5s'
password_encryption = 'scram-sha-256'
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_connections = off
log_disconnections = off
log_statement = 'none'
timezone = 'UTC'
